services:
  tyrajosaure:
    build: .
    container_name: tyrajosaure
    restart: unless-stopped
    environment:
      # Domaine du site : à définir via DOMAIN dans un fichier .env (voir .env.example)
      VIRTUAL_HOST: ${DOMAIN:-tyrajosaure.example.com}
      VIRTUAL_PORT: "8000"
      LETSENCRYPT_HOST: ${DOMAIN:-tyrajosaure.example.com}
    volumes:
      - tyrajosaure-data:/data
    networks:
      - proxy

volumes:
  tyrajosaure-data:

networks:
  proxy:
    external: true
    # Nom du réseau Docker partagé avec nginx-proxy (surchargeable via .env)
    name: ${PROXY_NETWORK:-nginx-proxy}
